
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no">

  <title>AR Project - Group 53</title>

  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>

  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #status-banner {
      position: fixed;
      top: 10px;
      left: 10px;
      padding: 10px 15px;
      background: #b91c1c;
      color: white;
      font-weight: bold;
      z-index: 9999;
      border-radius: 6px;
    }
  </style>
</head>

<body>

  <div id="status-banner">
    Searching for Marker...
  </div>

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    renderer="colorManagement: true;"
    vr-mode-ui="enabled: false">

    <a-assets timeout="30000">
      <a-asset-item
        id="car-model"
        src="car.glb">
      </a-asset-item>
    </a-assets>

    <a-light
      type="ambient"
      color="#ffffff"
      intensity="1.5">
    </a-light>

    <a-light
      type="directional"
      position="-1 3 2"
      intensity="1.3">
    </a-light>

    <a-marker
      preset="hiro"
      id="hiro-marker">

      <a-entity
        id="car-pivot"
        animation="property: rotation;
                   to: 0 360 0;
                   loop: true;
                   dur: 10000;
                   easing: linear;">

        
        <a-entity
  id="car"
  gltf-model="#car-model"
  rotation="180 0 0">
</a-entity>

      </a-entity>

    </a-marker>

    
    <a-entity camera></a-entity>

  </a-scene>

  <script>

    const marker = document.querySelector('#hiro-marker');
    const banner = document.querySelector('#status-banner');
    const car = document.querySelector('#car');

    
    marker.addEventListener('markerFound', () => {

      banner.textContent = 'Marker Found!';
      banner.style.backgroundColor = '#15803d';

    });

    
    marker.addEventListener('markerLost', () => {

      banner.textContent = 'Searching for Marker...';
      banner.style.backgroundColor = '#b91c1c';

    });

    
    car.addEventListener('model-loaded', () => {

      const mesh = car.getObject3D('mesh');

      if (!mesh) return;

      mesh.updateMatrixWorld(true);

      
      const bounds = new THREE.Box3().setFromObject(mesh);

      const size = new THREE.Vector3();
      const center = new THREE.Vector3();

      bounds.getSize(size);
      bounds.getCenter(center);

      
      const footprint = Math.max(size.x, size.z);

      if (footprint <= 0) return;

      
      const scale = 0.85 / footprint;

      
      car.object3D.scale.setScalar(scale);

      
      car.object3D.position.set(
        -center.x * scale,
        -bounds.min.y * scale + 0.01,
        -center.z * scale
      );

      console.log('Car Model Loaded Successfully!');

      console.log('Model Size:', size);
      console.log('Auto Scale:', scale);

    });

    
    car.addEventListener('model-error', (event) => {

      banner.textContent = 'Could not load car.glb';
      banner.style.backgroundColor = '#b91c1c';

      console.error('Model Loading Error:', event.detail);

    });

  </script>

</body>
</html>

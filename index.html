
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>AR Project - Group 53</title>

  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #status {
      position: fixed;
      top: 10px;
      left: 10px;
      padding: 12px 16px;
      background: #b91c1c;
      color: white;
      font-weight: bold;
      border-radius: 8px;
      z-index: 9999;
    }
  </style>
</head>

<body>

  <div id="status">
    Loading Car...
  </div>

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    renderer="colorManagement: true;
              physicallyCorrectLights: false;
              antialias: true;"
    vr-mode-ui="enabled: false">

    <a-assets timeout="30000">
      <a-asset-item
        id="car-model"
        src="car.glb">
      </a-asset-item>
    </a-assets>

    <a-light
      type="ambient"
      color="#ffffff"
      intensity="0.8">
    </a-light>

    <a-light
      type="directional"
      position="-2 4 3"
      intensity="1.0">
    </a-light>

    <a-marker
      preset="hiro"
      id="hiro-marker">

      <a-entity
        id="car-pivot"
        animation="property: rotation;
                   to: 0 360 0;
                   loop: true;
                   dur: 12000;
                   easing: linear;">

        <a-entity
          id="car"
          gltf-model="#car-model">
        </a-entity>

      </a-entity>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

  <script>

    const marker = document.querySelector('#hiro-marker');
    const status = document.querySelector('#status');
    const car = document.querySelector('#car');

    let modelLoaded = false;

    marker.addEventListener('markerFound', () => {
      status.textContent = modelLoaded
        ? 'Marker Found!'
        : 'Loading Car...';

      status.style.background = 'green';
    });

    marker.addEventListener('markerLost', () => {
      status.textContent = 'Searching for Marker...';
      status.style.background = '#b91c1c';
    });

    car.addEventListener('model-loaded', () => {

      const model = car.getObject3D('mesh');

      if (!model) return;

      model.traverse((child) => {

        if (!child.isMesh) return;

        child.frustumCulled = false;

        const materials = Array.isArray(child.material)
          ? child.material
          : [child.material];

        const fixedMaterials = materials.map((original) => {

          const material = original.clone();

          material.transparent = false;
          material.opacity = 1.0;
          material.alphaTest = 0;

          material.depthWrite = true;
          material.depthTest = true;

          material.side = THREE.FrontSide;
          
          if (material.emissive) {
            material.emissive.setRGB(0, 0, 0);
          }

          material.emissiveIntensity = 0;

          if (material.emissiveMap) {
            material.emissiveMap = null;
          }

          material.needsUpdate = true;

          return material;
        });

        child.material = Array.isArray(child.material)
          ? fixedMaterials
          : fixedMaterials[0];

        child.renderOrder = 0;

      });


      model.updateMatrixWorld(true);

      const bounds = new THREE.Box3().setFromObject(model);

      const size = new THREE.Vector3();
      const center = new THREE.Vector3();

      bounds.getSize(size);
      bounds.getCenter(center);

      const largest = Math.max(
        size.x,
        size.y,
        size.z
      );

      if (largest > 0) {

        const scale = 0.8 / largest;

        car.object3D.scale.setScalar(scale);

        car.object3D.position.set(
          -center.x * scale,
          -bounds.min.y * scale + 0.01,
          -center.z * scale
        );

      }


      const scene = document.querySelector('a-scene');

      if (scene.renderer) {

        scene.renderer.setPixelRatio(
          Math.min(window.devicePixelRatio, 2)
        );

        scene.renderer.outputEncoding = THREE.sRGBEncoding;

      }

      modelLoaded = true;

      status.textContent = marker.object3D.visible
        ? 'Marker Found!'
        : 'Car Ready!';

      console.log('Car loaded successfully');
      console.log('Transparency fixed');
      console.log('Model dimensions:', size);

    });

    car.addEventListener('model-error', (event) => {

      status.textContent = 'Car Loading Failed';
      status.style.background = 'red';

      console.error(event.detail);

    });

  </script>

</body>
</html>

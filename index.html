<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AR Project - Group 53</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
    <style>
      #status-banner {
        position: fixed; top: 10px; left: 10px;
        padding: 10px 15px; background-color: red; color: white;
        font-family: sans-serif; font-weight: bold;
        z-index: 9999; border-radius: 5px;
      }
    </style>
    <script>
      AFRAME.registerComponent('fix-materials', {
        init() {
          this.el.addEventListener('model-loaded', () => {
            this.el.object3D.traverse(node => {
              if (node.isMesh && node.material) {
                const mats = Array.isArray(node.material) ? node.material : [node.material];
                mats.forEach(m => {
                  m.transparent = false;
                  m.opacity = 1;
                  m.depthWrite = true;
                  m.side = THREE.DoubleSide;
                  m.needsUpdate = true;
                });
              }
            });
          });
        }
      });
    </script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    <div id="status-banner">Searching for Marker...</div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;"
             renderer="colorManagement: true; physicallyCorrectLights: true;">
      <a-assets>
        <a-asset-item id="car-model" src="car.glb"></a-asset-item>
      </a-assets>

      <a-light type="ambient" color="#ffffff" intensity="3.0"></a-light>
      <a-light type="directional" position="2 10 5" intensity="2.5"></a-light>

      <a-marker preset="hiro" id="hiro-marker">
        <a-entity id="fix" rotation="0 0 0">
          <a-entity
            gltf-model="#car-model"
            fix-materials
            scale="0.06 0.06 0.06"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
          </a-entity>
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const marker = document.querySelector('#hiro-marker');
      const banner = document.querySelector('#status-banner');
      const fix = document.querySelector('#fix');

      const rotations = [
        "0 0 0", "180 0 0", "90 0 0", "-90 0 0",
        "0 0 180", "0 0 90", "0 0 -90", "0 180 0",
        "90 180 0", "-90 180 0", "90 90 0", "-90 90 0"
      ];
      let i = 0;
      let found = false;

      marker.addEventListener('markerFound', () => {
        found = true;
        banner.textContent = 'Found! rotation: ' + rotations[i];
        banner.style.backgroundColor = 'green';
      });
      marker.addEventListener('markerLost', () => {
        found = false;
        banner.textContent = 'Searching for Marker...';
        banner.style.backgroundColor = 'red';
      });

      
      document.body.addEventListener('click', () => {
        i = (i + 1) % rotations.length;
        fix.setAttribute('rotation', rotations[i]);
        if (found) banner.textContent = 'Found! rotation: ' + rotations[i];
      });
    </script>
  </body>
</html>

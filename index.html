<!DOCTYPE html>
<html>
  <head>
    <title>AR Project - Group 53</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      #status-banner {
        position: fixed;
        top: 10px;
        left: 10px;
        padding: 10px 15px;
        background-color: red;
        color: white;
        font-family: sans-serif;
        font-weight: bold;
        z-index: 9999;
        border-radius: 5px;
      }
    </style>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    <div id="status-banner">Searching for Marker...</div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <a-assets>
        <a-asset-item id="car-model" src="car.glb"></a-asset-item>
      </a-assets>

      <a-marker preset="hiro" id="hiro-marker">
        <a-box position="-1 0.5 0" color="blue" animation="property: rotation; to: 0 360 0; loop: true; dur: 4000"></a-box>
        <a-sphere position="1 0.5 0" radius="0.5" color="red"></a-sphere>
        <a-cylinder id="clickable-cylinder" position="0 1.5 -1" radius="0.3" height="0.8" color="yellow" animation="property: position; to: 0 2 -1; dir: alternate; loop: true; dur: 2000"></a-cylinder>

        <a-entity gltf-model="#car-model" position="0 0.2 0" scale="0.05 0.05 0.05"></a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const marker = document.querySelector('#hiro-marker');
      const banner = document.querySelector('#status-banner');
      const cylinder = document.querySelector('#clickable-cylinder');

      marker.addEventListener('markerFound', () => {
        banner.textContent = 'Marker Found!';
        banner.style.backgroundColor = 'green';
      });

      marker.addEventListener('markerLost', () => {
        banner.textContent = 'Searching for Marker...';
        banner.style.backgroundColor = 'red';
      });

      cylinder.addEventListener('click', () => {
        cylinder.setAttribute('scale', '1.5 1.5 1.5');
      });
    </script>
  </body>
</html>

<!DOCTYPE html>
<html>
  <head>
    <title>AR Project - Group 53</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      #status-banner {
        position: fixed;
        top: 10px;
        left: 10px;
        padding: 10px 15px;
        background-color: red;
        color: white;
        font-family: sans-serif;
        font-weight: bold;
        z-index: 9999;
        border-radius: 5px;
      }
    </style>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    <div id="status-banner">Searching for Marker...</div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" renderer="colorManagement: true; exposure: 2.0;">
      <a-assets>
        <a-asset-item id="car-model" src="car.glb"></a-asset-item>
      </a-assets>

      <a-light type="ambient" color="#ffffff" intensity="5.0"></a-light>
      <a-light type="directional" position="0 10 10" intensity="3.0"></a-light>
      <a-light type="directional" position="0 -10 -10" intensity="2.0"></a-light>
      <a-light type="directional" position="10 10 0" intensity="2.0"></a-light>
      <a-light type="directional" position="-10 10 0" intensity="2.0"></a-light>

      <a-marker preset="hiro" id="hiro-marker">
        <a-entity 
          gltf-model="#car-model" 
          position="0 0.2 0" 
          rotation="20 0 0"
          scale="0.06 0.06 0.06"
          animation="property: rotation; to: 20 360 0; loop: true; dur: 8000">
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const marker = document.querySelector('#hiro-marker');
      const banner = document.querySelector('#status-banner');

      marker.addEventListener('markerFound', () => {
        banner.textContent = 'Marker Found!';
        banner.style.backgroundColor = 'green';
      });

      marker.addEventListener('markerLost', () => {
        banner.textContent = 'Searching for Marker...';
        banner.style.backgroundColor = 'red';
      });
    </script>
  </body>
</html>
